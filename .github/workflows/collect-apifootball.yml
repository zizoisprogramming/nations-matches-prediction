name: collect-apifootball

# API-Football's free plan only serves the current season from yesterday to tomorrow,
# so national-team match stats are collected every day (see src/collect_apifootball.py).
on:
    schedule:
        - cron: "17 6 * * *"
    workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      PYTHONUNBUFFERED: "1"
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.23"

      - name: Set up Python
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync

      - name: Collect yesterday's national-team matches
        run: make collect

      - name: Commit collected matches
        run: |
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/cache/apifootball_matches.json data/cache/team_ids.json
            if git diff --cached --quiet; then
                echo "No new matches."
            else
                git commit -m "data: API-Football matches $(date -u -d yesterday +%F)"
                git pull --rebase origin main
                git push
            fi
