name: fetch-data

on:
    schedule:
        - cron: "0 0 * * 0"
    workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        run: uv python install 3.14

      - name: Install dependencies
        run: |
            uv sync
            playwright install --with-deps chromium

      - name: Fetch new data
        run: make scrape