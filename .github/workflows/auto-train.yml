name: auto-train

on:
    schedule:
        - cron: "0 0 * * 0"
    workflow_dispatch:

jobs:
  train:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        run: uv python install 3.14

      - name: Install dependencies
        run: |
            uv sync
            uv run playwright install --with-deps chromium
    
      - name: Run Feature Extraction
        run: make feature_extraction

      - name: Run Feature Selection
        run: make feature_selection

      - name: Run Scaling
        run: make feature_scaling

      - name: Run train
        run: make train