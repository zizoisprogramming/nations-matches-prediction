name: auto-train

on:
    # Run after fetch-data has committed the new scrape, instead of racing it on the same cron.
    workflow_run:
        workflows: ["fetch-data"]
        types: [completed]
    workflow_dispatch:

jobs:
  train:
    env:
      PYTHONUNBUFFERED: "1"
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    # Sofascore 403s GitHub-hosted (Azure datacenter) IPs, so this runs on a
    # self-hosted runner on a home connection. The custom label keeps other jobs off it.
    runs-on: [self-hosted, macOS, sofascore]
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        run: uv python install 3.14

      - name: Install dependencies
        run: |
            uv sync
            uv run playwright install chromium

      - name: Stage new matches
        id: stage
        run: |
            make stage
            if [ -f data/staging/new_matches.csv ]; then
                echo "has_data=true" >> "$GITHUB_OUTPUT"
            else
                echo "has_data=false" >> "$GITHUB_OUTPUT"
            fi

      - name: Run Feature Extraction
        if: steps.stage.outputs.has_data == 'true'
        run: make feature_extraction

      - name: Run Feature Selection
        if: steps.stage.outputs.has_data == 'true'
        run: make feature_selection

      - name: Run Scaling
        if: steps.stage.outputs.has_data == 'true'
        run: make feature_scaling

      - name: Run train
        if: steps.stage.outputs.has_data == 'true'
        run: make train

      - name: Commit model and data
        if: steps.stage.outputs.has_data == 'true'
        run: |
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add models/ data/processed/scaled_train.csv data/staging/scraped.csv data/test/test.csv data/cache/
            if git diff --cached --quiet; then
                echo "No changes to commit."
            else
                git commit -m "model: weekly retrain $(date +%F)"
                git push
            fi
